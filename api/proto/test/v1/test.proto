syntax = "proto3";
package test.v1;

option go_package = "github.com/Fi44er/synthcity/api/gen/go/test/v1;testv1";


import "google/api/annotations.proto";

service HelloService {
  rpc SayHi(SayHiRequest) returns (SayHiResponse) {
    option (google.api.http) = {
      get: "/api/v1/say-hi/{name}"
    };
  }
}

message SayHiRequest { string name = 1; }
message SayHiResponse { string message = 1; }
